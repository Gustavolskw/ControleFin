# Só serve o Angular; /api, /ext e a entrada externa ficam no gateway (docker/nginx).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Arquivos com hash no nome podem ficar em cache por muito tempo.
    location ~* \.(js|css|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # O index.html nunca fica em cache (aponta para os arquivos da versão atual).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
