server:
  port: 8080
  # Atrás do gateway: usa X-Forwarded-* para o IP/protocolo reais.
  forward-headers-strategy: native
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: controlefin-backend
  web:
    locale: pt_BR
    locale-resolver: fixed
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/controlefin}
    username: ${DB_USER:controlefin}
    password: ${DB_PASSWORD:controlefin}
  jpa:
    open-in-view: false
    hibernate:
      # O esquema é só do Flyway (db/migration); o Hibernate apenas confere.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    # Mínimo de 32 caracteres. Em produção vem do .env (JWT_SECRET).
    secret: ${JWT_SECRET:dev-secret-troque-este-valor-com-32-chars-ou-mais}
    expiration-hours: ${JWT_EXPIRATION_HOURS:12}
  # Usuário administrador criado quando o banco está vazio (gera os convites para os demais).
  default-user:
    username: ${DEFAULT_USER:controlefin}
    password: ${DEFAULT_USER_PASSWORD:}
  security:
    max-failed-attempts: 5
    lock-minutes: 15
  # Segredo compartilhado só com a api-externa (rotas /api/internal/**). Em branco = rotas internas desligadas.
  internal-api:
    secret: ${INTERNAL_API_SECRET:}
