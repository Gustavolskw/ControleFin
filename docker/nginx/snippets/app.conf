# Rotas comuns aos servidores HTTP e HTTPS do gateway.
# Obs.: add_header em um location substitui os do nível acima; por isso os headers ficam em security-headers.conf
# e são incluídos em cada location.

client_max_body_size 1m;

location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# Rotas internas (api-externa -> backend) nunca são acessíveis de fora.
location ^~ /api/internal/ {
    return 404;
}

location /api/auth/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    limit_req zone=auth burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://backend_pool;
    include /etc/nginx/snippets/proxy.conf;
}

# Upload de anexos pelo site (até 10 MB por arquivo).
location ~ ^/api/transactions/[^/]+/attachments$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    client_max_body_size 11m;
    proxy_pass http://backend_pool;
    include /etc/nginx/snippets/proxy.conf;
}

location /api/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    proxy_pass http://backend_pool;
    include /etc/nginx/snippets/proxy.conf;
}

# API externa (MCP). Corpo maior: extratos, prints, PDFs e planilhas.
location /ext/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    client_max_body_size 25m;
    limit_req zone=ext burst=30 nodelay;
    limit_req_status 429;
    proxy_pass http://external_pool;
    include /etc/nginx/snippets/proxy.conf;
}

location / {
    include /etc/nginx/snippets/security-headers.conf;
    # O site só carrega recursos do próprio domínio (as fontes são servidas localmente).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    proxy_pass http://frontend_pool;
    include /etc/nginx/snippets/proxy.conf;
}
